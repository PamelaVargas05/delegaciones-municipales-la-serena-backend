{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 text-center">
            <div class="card shadow border-0 p-4">
                <div class="card-body">
                    <h4 class="fw-bold text-danger mb-3">¿Eliminar Delegación?</h4>
                    <p class="text-muted">
                        ¿Estás seguro de eliminar <strong>{{ delegacion.nombre }}</strong>? Esta acción borra el registro de la base de datos.
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-2 mt-4">
                            <button type="submit" class="btn btn-danger fw-bold">Sí, Eliminar</button>
                            <a href="{% url 'delegaciones:lista_delegaciones' %}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
