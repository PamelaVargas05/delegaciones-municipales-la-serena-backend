{% extends 'base.html' %}{% block content %}<h1 class="h3">Metas</h1><form class="mb-3"><input name="q" value="{{ query }}" placeholder="Buscar" class="form-control"></form><a class="btn btn-success mb-3" href="{% url 'delegaciones:crear_meta' %}">Nueva meta</a><table class="table"><tr><th>Título</th><th>Porcentaje</th><th>Delegación</th><th></th></tr>{% for meta in metas %}<tr><td>{{ meta.titulo }}</td><td>{{ meta.porcentaje }}%</td><td>{{ meta.delegacion }}</td><td><a href="{% url 'delegaciones:editar_meta' meta.pk %}">Editar</a> <a href="{% url 'delegaciones:eliminar_meta' meta.pk %}">Eliminar</a></td></tr>{% endfor %}</table>{% endblock %}
