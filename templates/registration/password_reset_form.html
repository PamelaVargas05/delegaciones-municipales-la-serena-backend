{% extends 'base.html' %} 
{% block content %} 
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Recuperar Contraseña</h3>
                
                <p class="text-muted text-center mb-4">Ingresa tu correo electrónico registrado y te enviaremos las instrucciones para restablecer tu contraseña.</p>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid gap-2 mt-3">
                        <button type="submit" class="btn btn-primary">Enviar instrucciones</button>
                    </div>
                </form>

                <div class="text-center mt-3">
                    <a href="{% url 'login' %}">Volver al Iniciar Sesión</a> 
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
