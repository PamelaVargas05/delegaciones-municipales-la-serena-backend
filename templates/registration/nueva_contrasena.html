{% extends 'base.html' %}
{% block title %}Crear nueva contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="form-card p-4 p-md-5">
    <div class="page-eyebrow">Acceso seguro</div>
    <h1 class="page-title h2 mt-2">Crear nueva contraseña</h1>
    <p class="page-subtitle mb-4">Elige una contraseña segura de al menos 8 caracteres.</p>
    <form method="post">{% csrf_token %}<div class="mb-3"><label for="id_password1" class="form-label">Nueva contraseña</label><input id="id_password1" type="password" name="password1" class="form-control" minlength="8" autocomplete="new-password" required></div><div class="mb-4"><label for="id_password2" class="form-label">Confirmar contraseña</label><input id="id_password2" type="password" name="password2" class="form-control" minlength="8" autocomplete="new-password" required></div><button type="submit" class="btn btn-municipal w-100">Cambiar contraseña</button></form>
    <div class="text-center mt-4"><a href="{% url 'login' %}" class="btn btn-link">← Volver al login</a></div>
</div></div></div>
{% endblock %}
