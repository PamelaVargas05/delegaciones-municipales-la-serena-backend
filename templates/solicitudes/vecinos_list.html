{% extends 'base.html' %}

{% block title %}Vecinos{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Vecinos</h1>
    <a href="{% url 'solicitudes:crear_vecino' %}" class="btn btn-primary">Nuevo vecino</a>
</div>

<form method="get" class="row g-2 mb-4">
    <div class="col-md-10">
        <label for="id_q" class="visually-hidden">Buscar vecinos</label>
        <input id="id_q" type="search" name="q" value="{{ query }}" class="form-control" placeholder="Buscar por RUT o nombre">
    </div>
    <div class="col-md-2 d-grid">
        <button type="submit" class="btn btn-outline-secondary">Buscar</button>
    </div>
</form>

<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead>
            <tr>
                <th scope="col">RUT</th>
                <th scope="col">Nombre</th>
                <th scope="col">Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for vecino in vecinos %}
            <tr>
                <td>{{ vecino.rut }}</td>
                <td>{{ vecino.nombre }}</td>
                <td>
                    <a href="{% url 'solicitudes:editar_vecino' vecino.pk %}" class="btn btn-sm btn-outline-primary">Editar</a>
                    <a href="{% url 'solicitudes:eliminar_vecino' vecino.pk %}" class="btn btn-sm btn-outline-danger">Eliminar</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="text-center text-muted">No existen vecinos registrados.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
