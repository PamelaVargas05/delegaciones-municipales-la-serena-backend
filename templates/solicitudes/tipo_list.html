{% extends 'base.html' %}{% block content %}<h1 class="h3">Tipos de solicitud</h1><form class="mb-3"><input name="q" value="{{ query }}" placeholder="Buscar" class="form-control"></form><a class="btn btn-success mb-3" href="{% url 'solicitudes:crear_tipo' %}">Nuevo tipo</a><table class="table">{% for tipo in tipos %}<tr><td>{{ tipo.nombre }}</td><td>{{ tipo.descripcion }}</td><td><a href="{% url 'solicitudes:editar_tipo' tipo.pk %}">Editar</a> <a href="{% url 'solicitudes:eliminar_tipo' tipo.pk %}">Eliminar</a></td></tr>{% endfor %}</table>{% endblock %}
