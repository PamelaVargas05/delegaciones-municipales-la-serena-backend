{% extends 'base.html' %}

{% block title %}Eliminar vecino{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h1 class="h3 mb-3">Eliminar vecino</h1>
        <p>¿Deseas eliminar a <strong>{{ vecino.nombre }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Confirmar eliminación</button>
            <a href="{% url 'solicitudes:lista_vecinos' %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
